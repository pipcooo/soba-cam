<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><title>SOBA BASS v0.5</title>
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#091009;color:#c9ffb6;font-family:system-ui,-apple-system,sans-serif}main{height:100dvh;display:flex;flex-direction:column;gap:10px;padding:12px 14px 16px;max-width:600px;margin:auto}header{display:flex;justify-content:space-between;align-items:baseline;gap:8px}h1{font-size:23px;margin:0}small{font-size:12px;color:#a2c29c}.readout{display:flex;justify-content:space-between;align-items:center;gap:8px}.hz{font-size:30px;font-weight:800;font-variant-numeric:tabular-nums}.panel{display:flex;gap:8px;align-items:center;justify-content:space-between}.panel button{flex:1;padding:12px 3px;background:#142819;border:1px solid #456f46;border-radius:10px;color:#c9ffb6;font-size:13px}.panel button.active{background:#a5ff8e;color:#10200d;border-color:#a5ff8e;font-weight:bold}#scopeWrap{height:clamp(90px,17dvh,145px);flex:0 0 auto;position:relative;border:1px solid #456f46;border-radius:12px;overflow:hidden;background:#071109}#scope{display:block;width:100%;height:100%}#scopeLabel{position:absolute;top:6px;left:9px;font:10px ui-monospace,monospace;color:#a0bd9a;pointer-events:none}.digits{height:34px;max-width:100%;vertical-align:middle;filter:drop-shadow(0 0 3px #a5ff8e55)}.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}#pad{flex:1;min-height:130px;position:relative;border:2px solid #78b568;border-radius:20px;touch-action:none;user-select:none;background:radial-gradient(circle at 50% 50%,#1c4122,#102017 65%);overflow:hidden}#pad.playing{border-color:#e3ff7a;box-shadow:inset 0 0 45px #8dff6233}#pad:before{content:"";position:absolute;inset:0;background:linear-gradient(to right,transparent 49.8%,#ffffff18 50%,transparent 50.2%),linear-gradient(to bottom,transparent 49.8%,#ffffff18 50%,transparent 50.2%);pointer-events:none}#hint{position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);text-align:center;color:#b3cda9;pointer-events:none;font-size:15px}#dot{position:absolute;left:50%;top:50%;width:34px;height:34px;border-radius:50%;background:#dcff8a;box-shadow:0 0 26px #b4ff77;transform:translate(-50%,-50%);pointer-events:none;opacity:.7}#pad.playing #dot{opacity:1}footer{font-size:12px;color:#9eb99b;line-height:1.5}a{color:#baffae}#status{font-size:12px;min-height:1.5em;color:#f0d992}@media(max-height:650px){main{gap:6px;padding:7px 12px}h1{font-size:19px}.panel button{padding:8px 3px}footer{font-size:11px}}
</style></head><body><main>
<header><h1>SOBA BASS 🥢</h1><small>v0.5 / 超低音シンセ</small></header>
<div class="readout"><div><small>FREQUENCY</small><div class="hz"><span id="hz" class="sr">55</span><svg id="hzDigits" class="digits" role="img" aria-label="55 Hz"></svg> <small>Hz</small></div></div><div style="text-align:right"><small>FILTER</small><div class="hz"><span id="cutoff" class="sr">600</span><svg id="cutoffDigits" class="digits" role="img" aria-label="600 Hz"></svg> <small>Hz</small></div></div></div>
<div class="panel" id="waves"><button class="active" data-wave="sine">SINE</button><button data-wave="sawtooth">SAW</button><button data-wave="square">SQUARE</button></div>
<div class="panel"><button id="normal" class="active" type="button">📱 通常</button><button id="airplay" type="button">📡 AirPlay実験</button></div><audio id="airAudio" controls playsinline x-webkit-airplay="allow" webkit-playsinline style="display:none;width:100%;height:40px"></audio><div id="scopeWrap"><canvas id="scope"></canvas><span id="scopeLabel">OSCILLOSCOPE / TIME DOMAIN</span></div><div id="pad"><div id="hint">指を置くと鳴る<br>← 5Hz　980Hz →<br>↑ 明るい音　暗い音 ↓</div><div id="dot"></div></div>
<div id="status">音量を小さくして試してね。</div>
<footer>AirPlay実験はiOS Safariで動かない可能性があります。AirPlay出力先を選んでから試してください。音は指を離すと止まります。最初のタッチで音声が有効になります。iPhone本体では超低音が聞こえにくい場合があります。<br><a href="./">← SOBA CAMに戻る</a></footer>
</main><script>
const pad=document.getElementById('pad'),dot=document.getElementById('dot'),hz=document.getElementById('hz'),cutoff=document.getElementById('cutoff'),status=document.getElementById('status');
let ac,osc,filter,gain,analyser,wave='sine',pointer=null,dest,airMode=false;const scope=document.getElementById('scope'),scopeCtx=scope.getContext('2d');const airAudio=document.getElementById('airAudio'),normalBtn=document.getElementById('normal'),airBtn=document.getElementById('airplay');
document.querySelectorAll('[data-wave]').forEach(b=>b.addEventListener('click',()=>{wave=b.dataset.wave;document.querySelectorAll('[data-wave]').forEach(x=>x.classList.toggle('active',x===b));if(osc)osc.type=wave}));
function setup(){if(ac)return;ac=new (window.AudioContext||window.webkitAudioContext)();osc=ac.createOscillator();filter=ac.createBiquadFilter();filter.type='lowpass';filter.Q.value=.7;gain=ac.createGain();gain.gain.value=0;osc.type=wave;osc.frequency.value=55;filter.frequency.value=600;osc.connect(filter);filter.connect(gain);analyser=ac.createAnalyser();analyser.fftSize=8192;gain.connect(analyser);analyser.connect(ac.destination);dest=ac.createMediaStreamDestination();airAudio.srcObject=dest.stream;osc.start()}
function switchOutput(useAir){try{setup();analyser.disconnect();analyser.connect(useAir?dest:ac.destination);airMode=useAir;normalBtn.classList.toggle('active',!useAir);airBtn.classList.toggle('active',useAir);airAudio.style.display=useAir?'block':'none';if(!useAir){airAudio.pause();status.textContent='通常出力に切り替えました'}else{status.textContent='AirPlay実験：再生ボタンを押すかパッドを触ってね。音声出力先も確認してね。';airAudio.play().catch(()=>{status.textContent='音声プレーヤーの▶を押してからパッドを触ってね'})}}catch(err){status.textContent='切替エラー: '+err.message}}
normalBtn.addEventListener('click',()=>switchOutput(false));airBtn.addEventListener('click',()=>switchOutput(true));
const vectorGlyphs={'0':'2,2 16,2 20,6 20,36 16,40 2,40 0,36 0,6 2,2','1':'5,9 12,2 12,40','2':'0,7 4,2 16,2 20,7 20,16 0,40 20,40','3':'0,2 20,2 20,21 6,21 20,21 20,40 0,40','4':'0,2 0,22 20,22 20,2 20,40','5':'20,2 0,2 0,21 17,21 20,24 20,36 17,40 0,40','6':'20,2 3,2 0,6 0,36 4,40 17,40 20,36 20,25 17,21 0,21','7':'0,2 20,2 8,40','8':'4,2 16,2 20,6 20,36 16,40 4,40 0,36 0,6 4,2 M0,21 20,21','9':'20,21 3,21 0,17 0,6 4,2 17,2 20,6 20,36 17,40 0,40'};function digits(id,value){const el=document.getElementById(id),str=String(Math.round(value));el.setAttribute('viewBox','0 0 '+(str.length*27)+' 44');el.setAttribute('width',str.length*23);el.setAttribute('aria-label',str);el.innerHTML=Array.from(str).map((char,i)=>'<polyline points="'+vectorGlyphs[char].split(' M')[0]+'" transform="translate('+(i*27+2)+',0)" fill="none" stroke="#baff8d" stroke-width="2" stroke-linecap="square" stroke-linejoin="miter"/>'+(char==='8'?'<path d="M'+(i*27+2)+' 21 h20" fill="none" stroke="#baff8d" stroke-width="2"/>':'')).join('')}digits('hzDigits',55);digits('cutoffDigits',600);
function drawScope(){requestAnimationFrame(drawScope);const bounds=scope.getBoundingClientRect(),dpr=Math.min(devicePixelRatio||1,2),w=Math.max(1,Math.round(bounds.width*dpr)),h=Math.max(1,Math.round(bounds.height*dpr));if(scope.width!==w||scope.height!==h){scope.width=w;scope.height=h}const g=scopeCtx;g.fillStyle='#071109';g.fillRect(0,0,w,h);g.strokeStyle='#28442b';g.lineWidth=1;for(let i=1;i<4;i++){g.beginPath();g.moveTo(0,h*i/4);g.lineTo(w,h*i/4);g.stroke()}for(let i=1;i<8;i++){g.beginPath();g.moveTo(w*i/8,0);g.lineTo(w*i/8,h);g.stroke()}if(!analyser)return;const data=new Float32Array(analyser.fftSize);analyser.getFloatTimeDomainData(data);const f=Math.max(5,Number(hz.textContent)||55),samplesPerCycle=ac.sampleRate/f,visibleSamples=Math.min(data.length,Math.max(32,Math.round(samplesPerCycle*2.5)));let start=0;for(let i=1;i<Math.min(data.length-visibleSamples,Math.round(samplesPerCycle*2));i++){if(data[i-1]<0&&data[i]>=0){start=i;break}}g.strokeStyle='#baff8d';g.lineWidth=Math.max(1.5,dpr*1.3);g.beginPath();for(let i=0;i<w;i++){const index=start+i*(visibleSamples-1)/Math.max(1,w-1),lo=Math.floor(index),v=data[lo]||0,y=h/2-v*h*.43*2.5;if(i===0)g.moveTo(i,y);else g.lineTo(i,y)}g.stroke()}requestAnimationFrame(drawScope);
function move(e){const r=pad.getBoundingClientRect(),x=Math.max(0,Math.min(1,(e.clientX-r.left)/r.width)),y=Math.max(0,Math.min(1,(e.clientY-r.top)/r.height)),f=Math.round(5*Math.pow(196,x)),c=Math.round(160*Math.pow(32,1-y));dot.style.left=(x*100)+'%';dot.style.top=(y*100)+'%';hz.textContent=f;cutoff.textContent=c;digits('hzDigits',f);digits('cutoffDigits',c);if(ac){osc.frequency.setTargetAtTime(f,ac.currentTime,.025);filter.frequency.setTargetAtTime(c,ac.currentTime,.025)}}
async function start(e){if(pointer!==null)return;try{setup();await ac.resume();if(airMode&&airAudio.paused){try{await airAudio.play()}catch(err){status.textContent='プレーヤーの▶を押してね'}}pointer=e.pointerId;pad.setPointerCapture(e.pointerId);move(e);gain.gain.cancelScheduledValues(ac.currentTime);gain.gain.setTargetAtTime(.12,ac.currentTime,.018);pad.classList.add('playing');status.textContent='発音中';}catch(err){pointer=null;status.textContent='音声を開始できません: '+err.message}}
function stop(e){if(pointer===null||e.pointerId!==pointer)return;pointer=null;if(ac){gain.gain.cancelScheduledValues(ac.currentTime);gain.gain.setTargetAtTime(0,ac.currentTime,.035)}pad.classList.remove('playing');status.textContent='指を置くと鳴ります'}
pad.addEventListener('pointerdown',start);pad.addEventListener('pointermove',e=>{if(e.pointerId===pointer)move(e)});pad.addEventListener('pointerup',stop);pad.addEventListener('pointercancel',stop);pad.addEventListener('lostpointercapture',e=>{if(pointer===e.pointerId)stop(e)});document.addEventListener('visibilitychange',()=>{if(document.hidden&&ac){gain.gain.setTargetAtTime(0,ac.currentTime,.01);pointer=null;pad.classList.remove('playing')}});
</script></body></html>
