<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><title>SOBA BASS v0.2</title>
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#091009;color:#c9ffb6;font-family:system-ui,-apple-system,sans-serif}main{height:100dvh;display:flex;flex-direction:column;gap:10px;padding:12px 14px 16px;max-width:600px;margin:auto}header{display:flex;justify-content:space-between;align-items:baseline;gap:8px}h1{font-size:23px;margin:0}small{font-size:12px;color:#a2c29c}.readout{display:flex;justify-content:space-between;align-items:center;gap:8px}.hz{font-size:30px;font-weight:800;font-variant-numeric:tabular-nums}.panel{display:flex;gap:8px;align-items:center;justify-content:space-between}.panel button{flex:1;padding:12px 3px;background:#142819;border:1px solid #456f46;border-radius:10px;color:#c9ffb6;font-size:13px}.panel button.active{background:#a5ff8e;color:#10200d;border-color:#a5ff8e;font-weight:bold}#pad{flex:1;min-height:130px;position:relative;border:2px solid #78b568;border-radius:20px;touch-action:none;user-select:none;background:radial-gradient(circle at 50% 50%,#1c4122,#102017 65%);overflow:hidden}#pad.playing{border-color:#e3ff7a;box-shadow:inset 0 0 45px #8dff6233}#pad:before{content:"";position:absolute;inset:0;background:linear-gradient(to right,transparent 49.8%,#ffffff18 50%,transparent 50.2%),linear-gradient(to bottom,transparent 49.8%,#ffffff18 50%,transparent 50.2%);pointer-events:none}#hint{position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);text-align:center;color:#b3cda9;pointer-events:none;font-size:15px}#dot{position:absolute;left:50%;top:50%;width:34px;height:34px;border-radius:50%;background:#dcff8a;box-shadow:0 0 26px #b4ff77;transform:translate(-50%,-50%);pointer-events:none;opacity:.7}#pad.playing #dot{opacity:1}footer{font-size:12px;color:#9eb99b;line-height:1.5}a{color:#baffae}#status{font-size:12px;min-height:1.5em;color:#f0d992}@media(max-height:650px){main{gap:6px;padding:7px 12px}h1{font-size:19px}.panel button{padding:8px 3px}footer{font-size:11px}}
</style></head><body><main>
<header><h1>SOBA BASS 🥢</h1><small>v0.2 / 超低音シンセ</small></header>
<div class="readout"><div><small>FREQUENCY</small><div class="hz"><span id="hz">55</span> Hz</div></div><div style="text-align:right"><small>FILTER</small><div class="hz"><span id="cutoff">600</span> <small>Hz</small></div></div></div>
<div class="panel" id="waves"><button class="active" data-wave="sine">SINE</button><button data-wave="sawtooth">SAW</button><button data-wave="square">SQUARE</button></div>
<div id="pad"><div id="hint">指を置くと鳴る<br>← 5Hz　140Hz →<br>↑ 明るい音　暗い音 ↓</div><div id="dot"></div></div>
<div id="status">音量を小さくして試してね。</div>
<footer>音は指を離すと止まります。最初のタッチで音声が有効になります。iPhone本体では超低音が聞こえにくい場合があります。<br><a href="./">← SOBA CAMに戻る</a></footer>
</main><script>
const pad=document.getElementById('pad'),dot=document.getElementById('dot'),hz=document.getElementById('hz'),cutoff=document.getElementById('cutoff'),status=document.getElementById('status');
let ac,osc,filter,gain,wave='sine',pointer=null;
document.querySelectorAll('[data-wave]').forEach(b=>b.addEventListener('click',()=>{wave=b.dataset.wave;document.querySelectorAll('[data-wave]').forEach(x=>x.classList.toggle('active',x===b));if(osc)osc.type=wave}));
function setup(){if(ac)return;ac=new (window.AudioContext||window.webkitAudioContext)();osc=ac.createOscillator();filter=ac.createBiquadFilter();filter.type='lowpass';filter.Q.value=.7;gain=ac.createGain();gain.gain.value=0;osc.type=wave;osc.frequency.value=55;filter.frequency.value=600;osc.connect(filter);filter.connect(gain);gain.connect(ac.destination);osc.start()}
function move(e){const r=pad.getBoundingClientRect(),x=Math.max(0,Math.min(1,(e.clientX-r.left)/r.width)),y=Math.max(0,Math.min(1,(e.clientY-r.top)/r.height)),f=Math.round(5*Math.pow(28,x)),c=Math.round(160*Math.pow(32,1-y));dot.style.left=(x*100)+'%';dot.style.top=(y*100)+'%';hz.textContent=f;cutoff.textContent=c;if(ac){osc.frequency.setTargetAtTime(f,ac.currentTime,.025);filter.frequency.setTargetAtTime(c,ac.currentTime,.025)}}
async function start(e){if(pointer!==null)return;try{setup();await ac.resume();pointer=e.pointerId;pad.setPointerCapture(e.pointerId);move(e);gain.gain.cancelScheduledValues(ac.currentTime);gain.gain.setTargetAtTime(.12,ac.currentTime,.018);pad.classList.add('playing');status.textContent='発音中';}catch(err){pointer=null;status.textContent='音声を開始できません: '+err.message}}
function stop(e){if(pointer===null||e.pointerId!==pointer)return;pointer=null;if(ac){gain.gain.cancelScheduledValues(ac.currentTime);gain.gain.setTargetAtTime(0,ac.currentTime,.035)}pad.classList.remove('playing');status.textContent='指を置くと鳴ります'}
pad.addEventListener('pointerdown',start);pad.addEventListener('pointermove',e=>{if(e.pointerId===pointer)move(e)});pad.addEventListener('pointerup',stop);pad.addEventListener('pointercancel',stop);pad.addEventListener('lostpointercapture',e=>{if(pointer===e.pointerId)stop(e)});document.addEventListener('visibilitychange',()=>{if(document.hidden&&ac){gain.gain.setTargetAtTime(0,ac.currentTime,.01);pointer=null;pad.classList.remove('playing')}});
</script></body></html>
