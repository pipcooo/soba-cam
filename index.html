<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>SOBA CAM</title><style>*{box-sizing:border-box}body{margin:0;background:#091009;color:#baffae;font-family:ui-monospace,SFMono-Regular,Menlo,monospace}.app{max-width:850px;margin:auto;padding:12px}h1{font-size:17px;margin:4px 0 10px}canvas{display:block;width:100%;aspect-ratio:9/16;background:#111;border:1px solid #476847;border-radius:8px}button,input{accent-color:#a4ff91}button{padding:12px 14px;background:#19331c;color:#d1ffca;border:1px solid #6a9b64;border-radius:8px;font-size:14px}button:disabled{opacity:.4}.controls{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}.range{display:flex;align-items:center;gap:10px;margin:10px 0}.range input{flex:1}small{color:#a1b6a0}#status{min-height:2em}a{color:#baffae}video{display:none}</style></head><body><div class="app"><h1>SOBA CAM <small> / audio-reactive quotation</small></h1><div class="controls"><button id="start">📷 カメラ＋マイク開始</button><button id="record" disabled>● 録画</button><button id="stop" disabled>■ 録画停止</button></div><div class="range"><label for="gain">感度</label><input id="gain" type="range" min="1" max="100" value="45"><span id="gainval">45</span></div><div class="range"><label for="manual">テスト</label><input id="manual" type="range" min="0" max="15" value="5"><span id="level">5</span></div><canvas id="view" width="720" height="1280"></canvas><p id="status">開始前はテストスライダーで確認できます。</p><small>HTTPSまたはlocalhostで開いてください。iPhone Safariでは録画形式や保存方法が端末により異なります。音声は録画にも含めます。</small><video id="camera" autoplay playsinline muted></video></div><script>
const $=id=>document.getElementById(id), canvas=$('view'),ctx=canvas.getContext('2d'),video=$('camera');const stages=['蕎麦','蕎麦をつける','蕎麦を蕎麦つゆにつける','蕎麦を蕎麦つゆに少しつける','蕎麦を蕎麦つゆに半分つける','蕎麦を蕎麦つゆに全部つける','蕎麦を蕎麦つゆに全部つけるのが下品で我慢ならない'];let stream,ac,analyser,buffer,recorder,chunks=[],live=false,recording=false,level=5,smoothed=0;function phrase(n){let s=stages[Math.min(6,n)];for(let i=7;i<=n;i++)s='「'+s+'」という投稿を見た';return s}function wrapText(text,maxWidth){const rows=[];let row='';for(const c of text){if(ctx.measureText(row+c).width>maxWidth&&row){rows.push(row);row=''}row+=c}if(row)rows.push(row);return rows}
function draw(){const w=canvas.width,h=canvas.height;ctx.fillStyle='#0b140c';ctx.fillRect(0,0,w,h);if(live&&video.readyState>=2){const vw=video.videoWidth,vh=video.videoHeight;const scale=Math.max(w/vw,h/vh),sw=w/scale,sh=h/scale;ctx.drawImage(video,(vw-sw)/2,(vh-sh)/2,sw,sh,0,0,w,h)}ctx.fillStyle='rgba(0,0,0,.34)';ctx.fillRect(0,0,w,h);ctx.font='48px ui-monospace, Menlo, monospace';ctx.textBaseline='top';ctx.fillStyle='#baffae';let y=40;for(const line of wrapText(phrase(level),w-62)){ctx.fillText(line,30,y);y+=64;if(y>h-60)break}ctx.font='19px ui-monospace,monospace';ctx.fillText('SOBA CAM  /  LEVEL '+String(level).padStart(2,'0'),30,h-55)}
function tick(){if(live&&analyser){analyser.getByteTimeDomainData(buffer);let sum=0;for(const v of buffer){const a=(v-128)/128;sum+=a*a}const rms=Math.sqrt(sum/buffer.length);smoothed=smoothed*.18+rms*.82;const gain=Number($('gain').value);level=Math.min(15,Math.max(0,Math.floor(Math.pow(Math.min(1,smoothed*gain),.65)*15)));$('level').textContent=level}else{level=Number($('manual').value);$('level').textContent=level}draw();requestAnimationFrame(tick)}$('gain').oninput=()=>{$('gainval').textContent=$('gain').value};$('manual').oninput=()=>{if(!live)level=Number($('manual').value)};
$('start').onclick=async()=>{try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:1280},height:{ideal:720}},audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false}});video.srcObject=stream;await video.play();ac=new (window.AudioContext||window.webkitAudioContext)();await ac.resume();const src=ac.createMediaStreamSource(stream);analyser=ac.createAnalyser();analyser.fftSize=2048;src.connect(analyser);buffer=new Uint8Array(analyser.fftSize);live=true;$('record').disabled=false;$('start').disabled=true;$('status').textContent='外カメラ＋マイク動作中。音に合わせて文字が切り替わります。'}catch(e){$('status').textContent='起動できません: '+e.message+'。HTTPSとカメラ・マイク許可を確認してください。'}};
$('record').onclick=()=>{try{const canvasStream=canvas.captureStream(30);const tracks=[...canvasStream.getVideoTracks(),...stream.getAudioTracks()];const combined=new MediaStream(tracks);const types=['video/mp4;codecs=h264,aac','video/mp4','video/webm;codecs=vp9,opus','video/webm'];const mimeType=types.find(t=>MediaRecorder.isTypeSupported(t));recorder=new MediaRecorder(combined,mimeType?{mimeType}:undefined);chunks=[];recorder.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};recorder.onstop=()=>{const type=recorder.mimeType||'video/webm',ext=type.includes('mp4')?'mp4':'webm',blob=new Blob(chunks,{type}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='soba-cam-'+new Date().toISOString().replace(/[:.]/g,'-')+'.'+ext;a.textContent='動画をダウンロード ('+ext+')';a.style.display='block';const status=$('status');status.replaceChildren(document.createTextNode('録画完了。 '));if(navigator.share&&navigator.canShare){const file=new File([blob],a.download,{type});if(navigator.canShare({files:[file]})){const share=document.createElement('button');share.textContent='共有して「ビデオを保存」';share.onclick=async()=>{try{await navigator.share({files:[file],title:'SOBA CAM'})}catch(e){if(e.name!=='AbortError')status.append(document.createTextNode(' 共有できません: '+e.message))}};status.append(share,document.createTextNode(' または '))}}status.append(a);$('record').disabled=false;$('stop').disabled=true};recorder.start(1000);recording=true;$('record').disabled=true;$('stop').disabled=false;$('status').textContent='録画中…'}catch(e){$('status').textContent='録画できません: '+e.message+'。このブラウザでは録画非対応の可能性があります。'}};$('stop').onclick=()=>{if(recorder&&recorder.state==='recording')recorder.stop();recording=false};tick();</script></body></html>
