const MAX_LEVEL=18;const $=id=>document.getElementById(id), canvas=$('view'),ctx=canvas.getContext('2d'),video=$('camera');const stages=['蕎麦','蕎麦をつける','蕎麦を蕎麦つゆにつける','蕎麦を蕎麦つゆに少しつける','蕎麦を蕎麦つゆに半分つける','蕎麦を蕎麦つゆに全部つける','蕎麦を蕎麦つゆに全部つけるのが下品で我慢ならない'];let stream,ac,analyser,buffer,bassFilter,bassAnalyser,bassBuffer,beatMode=0,beatTimes=[],beatInterval=0,nextPredicted=0,predictedFired=false,bassHistory=[],bassPrev=0,beatPeak=0,lastPulseAt=0,lastBeatAt=0,recorder,chunks=[],live=false,recording=false,level=5,displayLevel=5,lastPhraseChange=0,smoothed=0,noiseFloor=.001,peak=.015,audioHistory=[],lastAudioSample=0,lastStatusSecond=-1,recordStart=0,zoom=1,pinchDistance=0,pinchZoom=1;function phrase(n){let s=stages[Math.min(6,n)];for(let i=7;i<=n;i++)s+='という投稿を見た';return s}function wrapText(text,maxWidth){const rows=[];let row='';for(const c of text){if(ctx.measureText(row+c).width>maxWidth&&row){rows.push(row);row=''}row+=c}if(row)rows.push(row);return rows}
